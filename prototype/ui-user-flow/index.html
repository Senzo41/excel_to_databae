<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROTOTYPE — excel_to_database Web UI User Flow (Issue #6)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              50: "#eef2ff",
              100: "#e0e7ff",
              200: "#c7d2fe",
              400: "#818cf8",
              500: "#6366f1",
              600: "#4f46e5",
              700: "#4338ca",
              800: "#3730a3",
              900: "#312e81"
            }
          }
        }
      }
    };
  </script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap");
    body { font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; }
    code, pre, .font-mono { font-family: "JetBrains Mono", monospace; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.7); }
    @keyframes pulse-subtle { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .animate-pulse-subtle { animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

  <!-- Top Prototype Notice Banner -->
  <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 px-6 py-3 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <div class="bg-brand-600/20 text-brand-400 border border-brand-500/30 text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-brand-400 animate-ping"></span>
        Interactive UI Prototype
      </div>
      <span class="text-slate-400 text-sm font-medium">excel_to_database • <a href="https://github.com/Senzo41/excel_to_databae/issues/6" target="_blank" class="text-brand-400 hover:underline">Issue #6</a></span>
    </div>
    <div class="flex items-center gap-4 text-xs text-slate-400">
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> In-Memory State Active</span>
      <span class="hidden sm:inline text-slate-600">|</span>
      <button onclick="resetPrototypeState()" class="hover:text-slate-200 text-slate-400 transition underline underline-offset-4">Reset Demo State</button>
    </div>
  </header>

  <!-- Main Container -->
  <main id="app-root" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 pb-28">
    <!-- Dynamic Variant will mount here -->
  </main>

  <!-- Expandable Polars 50-Row Sample Dry-Run Drawer -->
  <div id="sample-drawer" class="fixed bottom-16 right-6 z-30 transition-all duration-300 max-w-2xl w-full">
    <div class="bg-slate-900/95 border border-slate-700 rounded-t-xl shadow-2xl backdrop-blur overflow-hidden transition-all duration-300" id="sample-drawer-content" style="max-height: 48px;">
      <div class="p-3 px-4 bg-slate-800/80 border-b border-slate-700/80 flex items-center justify-between cursor-pointer select-none" onclick="toggleSampleDrawer()">
        <div class="flex items-center gap-2 text-xs font-semibold text-slate-200">
          <svg class="w-4 h-4 text-brand-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
          <span>Polars Sample Dry-Run Preview</span>
          <span class="bg-slate-700 text-slate-300 px-2 py-0.5 rounded text-[10px] font-mono">50 rows cached (ADR-0003)</span>
        </div>
        <button class="text-slate-400 hover:text-slate-200 text-xs flex items-center gap-1 font-mono" id="sample-drawer-toggle-btn">
          <span>Expand</span>
          <svg class="w-4 h-4 transform transition-transform" id="sample-drawer-arrow" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="p-4 overflow-x-auto custom-scrollbar max-h-80 text-xs">
        <table class="w-full text-left font-mono border-collapse" id="dry-run-sample-table">
          <!-- Transformed Sample Table Content -->
        </table>
      </div>
    </div>
  </div>

  <!-- Floating Prototype Variant Switcher (Per Prototype Skill) -->
  <aside class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 border border-slate-700 text-white rounded-full shadow-2xl backdrop-blur-md px-4 py-2 flex items-center gap-4 text-xs">
    <button onclick="prevVariant()" aria-label="Previous Variant" class="p-1 rounded-full hover:bg-slate-800 text-slate-400 hover:text-white transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div class="flex items-center gap-2">
      <span class="text-slate-500 font-mono">VARIANT:</span>
      <span id="variant-label" class="font-semibold text-brand-400">A — Guided Wizard (Recommended)</span>
    </div>
    <button onclick="nextVariant()" aria-label="Next Variant" class="p-1 rounded-full hover:bg-slate-800 text-slate-400 hover:text-white transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    </button>
    <div class="hidden sm:flex items-center pl-2 border-l border-slate-700 text-[11px] text-slate-500 gap-1 font-mono">
      <span>Use</span> <kbd class="bg-slate-800 px-1.5 py-0.5 rounded text-slate-300">←</kbd> <kbd class="bg-slate-800 px-1.5 py-0.5 rounded text-slate-300">→</kbd>
    </div>
  </aside>

  <!-- Prototype Application Logic -->
  <script>
    // --- Mock State & Realistic Test Data ---
    const INITIAL_STATE = {
      variant: "A",
      stage: 3, // 1: Upload, 2: Synthesis, 3: Review & Map, 4: Target Sink & Migrate
      uploadedFiles: [
        {
          id: "f1",
          name: "2023_Fertigung_DE.xlsx",
          size: "3.4 MB",
          sheetCount: 2,
          sheets: [
            { name: "Produktion_Q1", rows: 42300, headerRow: 5, dataRegion: "A5:G42305" },
            { name: "Qualitaet_Log", rows: 8120, headerRow: 1, dataRegion: "A1:E8120" }
          ]
        },
        {
          id: "f2",
          name: "2023_US_Production_Q1.xlsx",
          size: "2.1 MB",
          sheetCount: 1,
          sheets: [
            { name: "Plant_Detroit", rows: 31200, headerRow: 1, dataRegion: "A1:F31200" }
          ]
        }
      ],
      aiReasoningLog: [
        "Identified 2 workbooks containing 3 data regions across 2 languages (German / English).",
        "Header heuristic triggered on `Produktion_Q1`: Detected title block in rows 1-4; column labels extracted from row 5 (score: 0.94).",
        "Found semantic overlap: `Arbeitsschritt` (DE) and `Process_Type` (US) represent canonical entity `operation_type`.",
        "Detected 3 casing/typo flaws in DE sheet: 'Spanen' (94%), 'spanen' (5%), 'Spanien' (1%). Proposing categorical normalization.",
        "Detected percentage format mismatch: DE sheet `Fertigstellung_%` uses 0-100 scale (e.g. 78.0), US sheet `Completion_Rate` uses 0.0-1.0 scale (e.g. 0.78).",
        "Detected European comma decimal separator in `Kosten_EUR` (e.g. '12,50'). Synthesizing `PARSE_EU_DECIMAL` rule.",
        "Synthesizing unified Target Schema `production_events` (6 columns, 1 PK, 2 synthetic filename dimensions)."
      ],
      llmTokensStreamed: true,
      targetSchema: {
        tableName: "production_events",
        description: "Unified cross-plant manufacturing operations log",
        columns: [
          {
            name: "event_id",
            type: "UUID",
            isPk: true,
            sourceMapping: "AUTO_GENERATED",
            confidence: 1.0,
            transform: { op: "UUID_V4" },
            samples: { raw: "-", transformed: "c9bf9e57-1685-4c89-bafb-ff5af830be8a" }
          },
          {
            name: "event_date",
            type: "Date",
            isPk: false,
            sourceMapping: ["Produktion_Q1:Datum", "Plant_Detroit:Date"],
            confidence: 0.96,
            transform: { op: "PARSE_DATE", formatAuto: true, formats: ["%d.%m.%Y", "%m/%d/%Y"] },
            samples: { raw: "31.03.2023 / 03/31/2023", transformed: "2023-03-31" }
          },
          {
            name: "operation_type",
            type: "String",
            isPk: false,
            sourceMapping: ["Produktion_Q1:Arbeitsschritt", "Plant_Detroit:Process_Type"],
            confidence: 0.92,
            anomaly: {
              type: "TYPO_CASING",
              description: "3 casing/spelling variations: 'Spanen' (820), 'spanen' (112), 'Spanien' (4)",
              quickFixLabel: "Normalize Categories & Typos",
              fixed: false
            },
            transform: { op: "NORMALIZE_CATEGORICAL", rules: { "spanen": "Spanen", "Spanien": "Spanen" } },
            samples: {
              rawUnfixed: "spanen, Spanien, Fräsen",
              rawFixed: "Spanen, Spanen, Fräsen",
              transformed: "Spanen"
            }
          },
          {
            name: "completion_pct",
            type: "Float64",
            isPk: false,
            sourceMapping: ["Produktion_Q1:Fertigstellung_%", "Plant_Detroit:Completion_Rate"],
            confidence: 0.95,
            anomaly: {
              type: "SCALE_FLAW",
              description: "Inconsistent percentage scale: DE sheet has integer values (78.0) vs US sheet (0.78)",
              quickFixLabel: "Scale Percentages (×0.01)",
              fixed: false
            },
            transform: { op: "SCALE_NUMERIC", multiplier: 0.01 },
            samples: {
              rawUnfixed: "78.0 (DE) vs 0.78 (US)",
              rawFixed: "0.78 (DE) / 0.78 (US)",
              transformed: "0.78"
            }
          },
          {
            name: "cost_eur",
            type: "Float64",
            isPk: false,
            sourceMapping: ["Produktion_Q1:Kosten_EUR", "Plant_Detroit:Cost_USD"],
            confidence: 0.91,
            anomaly: {
              type: "LOCALE_DECIMAL",
              description: "German comma decimal format '12,50' detected in DE sheet",
              quickFixLabel: "Parse EU Decimal (',' → '.')",
              fixed: true
            },
            transform: { op: "PARSE_EU_DECIMAL" },
            samples: {
              rawUnfixed: "'12,50'",
              rawFixed: "12.50",
              transformed: "12.50"
            }
          },
          {
            name: "source_region",
            type: "String",
            isPk: false,
            sourceMapping: "EXTRACT_FROM_FILENAME",
            confidence: 0.98,
            transform: { op: "REGEX_EXTRACT", pattern: ".*_([A-Z]{2})_?.*\.xlsx", captureGroup: 1 },
            samples: { raw: "2023_Fertigung_DE.xlsx", transformed: "DE" }
          }
        ]
      },
      targetSink: {
        type: "duckdb",
        path: "./warehouse.duckdb",
        tableMode: "CREATE_IF_NOT_EXISTS",
        preflightStatus: "VERIFIED"
      },
      migration: {
        isRunning: false,
        isCancelled: false,
        totalRows: 81620,
        processedRows: 0,
        currentStage: "Ready",
        logs: []
      }
    };

    let state = JSON.parse(JSON.stringify(INITIAL_STATE));

    // --- Variant Management ---
    const VARIANTS = [
      { key: "A", name: "A — Guided Wizard (Recommended)" },
      { key: "B", name: "B — Studio Master-Detail Layout" },
      { key: "C", name: "C — Spreadsheet Matrix Grid" }
    ];

    function initVariantFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const v = params.get("variant");
      if (v && ["A", "B", "C"].includes(v.toUpperCase())) {
        state.variant = v.toUpperCase();
      } else {
        state.variant = "A";
      }
      render();
    }

    function setVariant(newKey) {
      state.variant = newKey;
      const url = new URL(window.location.href);
      url.searchParams.set("variant", newKey);
      window.history.replaceState({}, "", url);
      render();
    }

    function nextVariant() {
      const idx = VARIANTS.findIndex(v => v.key === state.variant);
      const nextIdx = (idx + 1) % VARIANTS.length;
      setVariant(VARIANTS[nextIdx].key);
    }

    function prevVariant() {
      const idx = VARIANTS.findIndex(v => v.key === state.variant);
      const prevIdx = (idx - 1 + VARIANTS.length) % VARIANTS.length;
      setVariant(VARIANTS[prevIdx].key);
    }

    window.addEventListener("keydown", (e) => {
      if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
      if (e.key === "ArrowRight") nextVariant();
      if (e.key === "ArrowLeft") prevVariant();
    });

    function resetPrototypeState() {
      state = JSON.parse(JSON.stringify(INITIAL_STATE));
      render();
    }

    // --- Actions ---
    function setStage(newStage) {
      state.stage = newStage;
      render();
    }

    function toggleQuickFix(colIndex) {
      const col = state.targetSchema.columns[colIndex];
      if (col && col.anomaly) {
        col.anomaly.fixed = !col.anomaly.fixed;
        render();
      }
    }

    function simulatePreflight() {
      state.targetSink.preflightStatus = "RUNNING";
      render();
      setTimeout(() => {
        state.targetSink.preflightStatus = "VERIFIED";
        render();
      }, 700);
    }

    let migrationInterval = null;
    function startMigration() {
      state.migration.isRunning = true;
      state.migration.isCancelled = false;
      state.migration.processedRows = 0;
      state.migration.logs = [
        "[SSE Event: 1] Initializing Polars LazyFrame execution engine...",
        "[SSE Event: 2] Verified Target Sink write permissions on ./warehouse.duckdb",
        "[SSE Event: 3] Calamine pre-extraction: processing 2023_Fertigung_DE.xlsx [Header offset row 5]..."
      ];
      render();

      if (migrationInterval) clearInterval(migrationInterval);
      migrationInterval = setInterval(() => {
        if (state.migration.processedRows < state.migration.totalRows) {
          state.migration.processedRows += Math.floor(Math.random() * 9500) + 4000;
          if (state.migration.processedRows > state.migration.totalRows) {
            state.migration.processedRows = state.migration.totalRows;
          }
          const pct = Math.round((state.migration.processedRows / state.migration.totalRows) * 100);
          state.migration.logs.push(`[SSE Event] Written ${state.migration.processedRows.toLocaleString()} / ${state.migration.totalRows.toLocaleString()} rows (${pct}%)`);
          render();
        } else {
          clearInterval(migrationInterval);
          state.migration.isRunning = false;
          state.migration.logs.push("[SSE Event: DONE] Migration completed successfully in 1.42s. 81,620 rows committed into DuckDB table `production_events`.");
          render();
        }
      }, 400);
    }

    function cancelMigration() {
      if (migrationInterval) clearInterval(migrationInterval);
      state.migration.isRunning = false;
      state.migration.isCancelled = true;
      state.migration.logs.push("[SSE Event: CANCELLED] Received user cancellation token (asyncio.Event). Cooperative worker terminated cleanly without corrupting target sink.");
      render();
    }

    let isDrawerOpen = false;
    function toggleSampleDrawer() {
      isDrawerOpen = !isDrawerOpen;
      const drawer = document.getElementById("sample-drawer-content");
      const arrow = document.getElementById("sample-drawer-arrow");
      const btnText = document.querySelector("#sample-drawer-toggle-btn span");
      if (isDrawerOpen) {
        drawer.style.maxHeight = "500px";
        arrow.style.transform = "rotate(180deg)";
        btnText.textContent = "Collapse";
      } else {
        drawer.style.maxHeight = "48px";
        arrow.style.transform = "rotate(0deg)";
        btnText.textContent = "Expand";
      }
    }

    // --- Renderers ---
    function render() {
      // Update switcher label
      const currentVariant = VARIANTS.find(v => v.key === state.variant);
      document.getElementById("variant-label").textContent = currentVariant ? currentVariant.name : state.variant;

      // Render Sample Table
      renderSampleTable();

      // Render Root App View
      const root = document.getElementById("app-root");
      if (state.variant === "A") {
        root.innerHTML = renderVariantA();
      } else if (state.variant === "B") {
        root.innerHTML = renderVariantB();
      } else {
        root.innerHTML = renderVariantC();
      }
    }

    function renderSampleTable() {
      const table = document.getElementById("dry-run-sample-table");
      if (!table) return;

      const cols = state.targetSchema.columns;
      let html = `<thead><tr class="border-b border-slate-700 bg-slate-800/60 text-slate-300">`;
      cols.forEach(c => {
        html += `<th class="py-2 px-3">${c.name} <span class="text-[10px] text-slate-500 font-normal">(${c.type})</span></th>`;
      });
      html += `</tr></thead><tbody class="divide-y divide-slate-800/80 text-slate-400">`;

      const sampleRows = [
        { id: "e1a90b81", date: "2023-03-31", opFixed: "Spanen", opUnfixed: "spanen", pctFixed: 0.78, pctUnfixed: 78.0, cost: 12.50, region: "DE" },
        { id: "e2c81d92", date: "2023-03-31", opFixed: "Spanen", opUnfixed: "Spanien", pctFixed: 0.85, pctUnfixed: 85.0, cost: 18.20, region: "DE" },
        { id: "e3f94a11", date: "2023-03-31", opFixed: "Fräsen", opUnfixed: "Fräsen", pctFixed: 0.78, pctUnfixed: 0.78, cost: 45.00, region: "US" }
      ];

      sampleRows.forEach((r) => {
        const opCol = cols.find(c => c.name === "operation_type");
        const pctCol = cols.find(c => c.name === "completion_pct");
        const opVal = (opCol && opCol.anomaly && opCol.anomaly.fixed) ? r.opFixed : r.opUnfixed;
        const pctVal = (pctCol && pctCol.anomaly && pctCol.anomaly.fixed) ? r.pctFixed : r.pctUnfixed;

        html += `<tr class="hover:bg-slate-800/40">
          <td class="py-2 px-3 text-slate-500">${r.id}..</td>
          <td class="py-2 px-3 text-emerald-400">${r.date}</td>
          <td class="py-2 px-3 font-semibold ${opVal === 'spanen' || opVal === 'Spanien' ? 'text-amber-400 bg-amber-950/20' : 'text-slate-200'}">${opVal}</td>
          <td class="py-2 px-3 font-semibold ${pctVal > 1 ? 'text-amber-400 bg-amber-950/20' : 'text-slate-200'}">${pctVal}</td>
          <td class="py-2 px-3 text-slate-300">${r.cost.toFixed(2)}</td>
          <td class="py-2 px-3 text-brand-400">${r.region}</td>
        </tr>`;
      });
      html += `</tbody>`;
      table.innerHTML = html;
    }

    // ==========================================
    // VARIANT A: Guided Wizard Flow (Recommended)
    // ==========================================
    function renderVariantA() {
      return `
        <div class="space-y-6">
          <!-- Wizard Stepper Header -->
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-lg">
            <div class="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                  <span>Excel to Database Migration Session</span>
                  <span class="text-xs bg-slate-800 text-slate-400 font-mono px-2 py-0.5 rounded-full border border-slate-700">sess_9a8f21</span>
                </h1>
                <p class="text-xs text-slate-400 mt-1">Guided wizard workflow for messy Excel extraction, LLM schema harmonization, and Polars execution.</p>
              </div>

              <!-- Steps Pill Navigation -->
              <nav class="flex items-center gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800 text-xs">
                ${renderStepButton(1, "1. Ingest & Extract")}
                <span class="text-slate-700">→</span>
                ${renderStepButton(2, "2. AI Synthesis")}
                <span class="text-slate-700">→</span>
                ${renderStepButton(3, "3. Review & Map")}
                <span class="text-slate-700">→</span>
                ${renderStepButton(4, "4. Target Sink & Migrate")}
              </nav>
            </div>
          </div>

          <!-- Step Body Content -->
          ${renderStepContent()}
        </div>
      `;
    }

    function renderStepButton(stepNum, label) {
      const isActive = state.stage === stepNum;
      const isPast = state.stage > stepNum;
      return `
        <button onclick="setStage(${stepNum})" class="px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5 ${
          isActive 
            ? 'bg-brand-600 text-white shadow' 
            : isPast 
              ? 'text-slate-300 hover:bg-slate-800' 
              : 'text-slate-500 hover:text-slate-300'
        }">
          ${isPast ? '<span class="text-emerald-400">✓</span>' : ''}
          ${label}
        </button>
      `;
    }

    function renderStepContent() {
      if (state.stage === 1) return renderStage1Upload();
      if (state.stage === 2) return renderStage2Synthesis();
      if (state.stage === 3) return renderStage3ReviewMap();
      if (state.stage === 4) return renderStage4Migrate();
    }

    // Stage 1: Upload & Extraction
    function renderStage1Upload() {
      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2 space-y-4">
            <div class="border-2 border-dashed border-slate-700 hover:border-brand-500 bg-slate-900/50 rounded-2xl p-8 text-center transition cursor-pointer group">
              <div class="w-12 h-12 rounded-full bg-brand-500/10 text-brand-400 flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
              </div>
              <h3 class="text-sm font-semibold text-slate-200">Drop your messy Excel & CSV files here</h3>
              <p class="text-xs text-slate-400 mt-1">Supports multi-sheet .xlsx, .xls, .csv with offset title blocks, merged headers & irregular layouts</p>
              <button class="mt-4 px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-lg text-xs font-medium transition shadow">Browse Files</button>
            </div>

            <!-- Uploaded Files List with Extraction Heuristic Diagnostics -->
            <div class="space-y-3">
              <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Detected Workbooks & Calamine Pre-Extraction</h4>
              ${state.uploadedFiles.map(f => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div class="flex items-center gap-3">

                  <td class="p-3 border-r border-slate-800 font-semibold ${cols[3].anomaly?.fixed ? 'text-slate-200' : 'text-amber-400'}">

                <tr class="hover:bg-slate-800/30">
                  <td class="p-3 border-r border-slate-800 text-slate-500">d1a49f12..</td>
                  <td class="p-3 border-r border-slate-800 text-emerald-400">2023-03-31</td>
                  <td class="p-3 border-r border-slate-800 font-semibold ${cols[2].anomaly?.fixed ? 'text-slate-200' : 'text-amber-400'}">
                    ${cols[2].anomaly?.fixed ? 'Spanen' : 'Spanien'}

                  <td class="p-3 border-r border-slate-800 font-semibold ${cols[3].anomaly?.fixed ? 'text-slate-200' : 'text-amber-400'}">
