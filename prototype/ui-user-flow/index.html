<body class="bg-slate-50 dark:bg-notion-bgDark text-slate-800 dark:text-notion-textDark min-h-screen flex flex-col transition-colors duration-200 selection:bg-indigo-500 selection:text-white">

    <!-- Right Controls -->

        <svg class="w-4 h-4 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>

        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        <span>Issue #6</span>

  <!-- Main Workspace Canvas -->
  <main id="app-root" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 pb-28">
    <!-- Dynamic Variant will mount here -->
  </main>

  <!-- Collapsible Polars 50-Row Sample Dry-Run Drawer (Floating Dock) -->
  <div id="sample-drawer" class="fixed bottom-16 right-6 z-30 transition-all duration-300 max-w-2xl w-full">
    <div class="bg-white dark:bg-notion-cardDark border border-slate-200 dark:border-notion-borderDark rounded-xl shadow-xl overflow-hidden transition-all duration-300" id="sample-drawer-content" style="max-height: 44px;">
      <div class="p-2.5 px-4 bg-slate-100/70 dark:bg-slate-800/60 border-b border-slate-200 dark:border-notion-borderDark flex items-center justify-between cursor-pointer select-none" onclick="toggleSampleDrawer()">
        <div class="flex items-center gap-2 text-xs font-semibold text-slate-800 dark:text-slate-200">
          <span class="text-indigo-600 dark:text-indigo-400">⚡</span>
          <span>Polars Sample Dry-Run Preview</span>
          <span class="bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 px-1.5 py-0.5 rounded text-[10px] font-mono">50 rows cached (ADR-0003)</span>
        </div>
        <button class="text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 text-xs flex items-center gap-1 font-mono" id="sample-drawer-toggle-btn">
          <span>Expand Table</span>
          <svg class="w-3.5 h-3.5 transform transition-transform" id="sample-drawer-arrow" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="p-3 overflow-x-auto custom-scrollbar max-h-72 text-xs">
        <table class="w-full text-left font-mono border-collapse" id="dry-run-sample-table">
          <!-- Transformed Sample Table Content -->
        </table>
      </div>
    </div>
  </div>

  <!-- Floating Prototype Variant Switcher -->
  <aside class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 dark:bg-slate-900/95 border border-slate-700 text-white rounded-full shadow-2xl backdrop-blur-md px-4 py-2 flex items-center gap-4 text-xs">
    <button onclick="prevVariant()" aria-label="Previous Variant" class="p-1 rounded-full hover:bg-slate-800 text-slate-400 hover:text-white transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div class="flex items-center gap-2">
      <span class="text-slate-500 font-mono text-[11px]">LAYOUT:</span>
      <span id="variant-label" class="font-semibold text-indigo-400">A — Notion SaaS Pipeline (Recommended)</span>
    </div>
    <button onclick="nextVariant()" aria-label="Next Variant" class="p-1 rounded-full hover:bg-slate-800 text-slate-400 hover:text-white transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    </button>
    <div class="hidden sm:flex items-center pl-2 border-l border-slate-700 text-[11px] text-slate-400 gap-1 font-mono">
      <span>Key:</span> <kbd class="bg-slate-800 px-1.5 py-0.5 rounded text-slate-300">←</kbd> <kbd class="bg-slate-800 px-1.5 py-0.5 rounded text-slate-300">→</kbd>
    </div>
  </aside>

  <!-- Prototype Interactive Script -->
  <script>
    // --- Mock State & Realistic Test Data ---
    const INITIAL_STATE = {
      variant: "A",
      stage: 3, // 1: Upload, 2: Synthesis, 3: Review & Map, 4: Target Sink & Migrate
      uploadedFiles: [
        {
          id: "f1",
          name: "2023_Fertigung_DE.xlsx",
          size: "3.4 MB",
          sheetCount: 2,
          sheets: [
            { name: "Produktion_Q1", rows: 42300, headerRow: 5, dataRegion: "A5:G42305" },
            { name: "Qualitaet_Log", rows: 8120, headerRow: 1, dataRegion: "A1:E8120" }
          ]
        },
        {
          id: "f2",
          name: "2023_US_Production_Q1.xlsx",
          size: "2.1 MB",
          sheetCount: 1,
          sheets: [
            { name: "Plant_Detroit", rows: 31200, headerRow: 1, dataRegion: "A1:F31200" }
          ]
        }
      ],
      aiReasoningLog: [
        "Ingested 2 workbooks containing 3 data regions across German and English layouts.",
        "Header heuristic triggered on `Produktion_Q1`: Offset title block detected; header candidate extracted from row 5 (confidence 96%).",
        "Found semantic entity match: `Arbeitsschritt` (DE) ↔ `Process_Type` (US) → `operation_type`.",
        "Quality Heuristic: Detected 3 casing/typo variations in DE sheet ('Spanen' 94%, 'spanen' 5%, 'Spanien' 1%). Proposing categorical normalization.",
        "Quality Heuristic: Detected percentage format flaw: DE sheet `Fertigstellung_%` uses 0-100 scale (e.g. 78.0) vs US sheet `Completion_Rate` uses 0.0-1.0 (e.g. 0.78).",
        "Quality Heuristic: Detected European comma decimal format in `Kosten_EUR` (e.g. '12,50'). Synthesizing `PARSE_EU_DECIMAL` rule.",
        "Synthesizing unified Target Schema `production_events` (6 columns, 1 PK, 2 synthetic filename metadata dimensions)."
      ],
      targetSchema: {
        tableName: "production_events",
        description: "Unified cross-plant manufacturing operations log",
        columns: [
          {
            name: "event_id",
            icon: "🔑",
            type: "UUID",
            isPk: true,
            sourceMapping: "AUTO_GENERATED",
            confidence: 1.0,
            transform: { op: "UUID_V4" },
            samples: { raw: "-", transformed: "c9bf9e57-1685-4c89-bafb-ff5af830be8a" }
          },
          {
            name: "event_date",
            icon: "📅",
            type: "Date",
            isPk: false,
            sourceMapping: ["Produktion_Q1:Datum", "Plant_Detroit:Date"],
            confidence: 0.96,
            transform: { op: "PARSE_DATE", formats: ["%d.%m.%Y", "%m/%d/%Y"] },
            samples: { raw: "31.03.2023 / 03/31/2023", transformed: "2023-03-31" }
          },
          {
            name: "operation_type",
            icon: "🏷️",
            type: "String",
            isPk: false,
            sourceMapping: ["Produktion_Q1:Arbeitsschritt", "Plant_Detroit:Process_Type"],
            confidence: 0.92,
            anomaly: {
              type: "TYPO_CASING",
              description: "3 casing/spelling variations: 'Spanen' (820), 'spanen' (112), 'Spanien' (4)",
              quickFixLabel: "Normalize Typos & Casing",
              fixed: false
            },
            transform: { op: "NORMALIZE_CATEGORICAL", rules: { "spanen": "Spanen", "Spanien": "Spanen" } },
            samples: {
              rawUnfixed: "spanen, Spanien, Fräsen",
              rawFixed: "Spanen, Spanen, Fräsen",
              transformed: "Spanen"
            }
          },
          {
            name: "completion_pct",
            icon: "#",
            type: "Float64",
            isPk: false,
            sourceMapping: ["Produktion_Q1:Fertigstellung_%", "Plant_Detroit:Completion_Rate"],
            confidence: 0.95,
            anomaly: {
              type: "SCALE_FLAW",
              description: "Percentage scale flaw: DE sheet has integer values (78.0) vs US sheet (0.78)",
              quickFixLabel: "Scale to Unit Percentage (×0.01)",
              fixed: false
            },
            transform: { op: "SCALE_NUMERIC", multiplier: 0.01 },
            samples: {
              rawUnfixed: "78.0 (DE) vs 0.78 (US)",
              rawFixed: "0.78 (DE) / 0.78 (US)",
              transformed: "0.78"
            }
          },
          {
            name: "cost_eur",
            icon: "💵",
            type: "Float64",
            isPk: false,
            sourceMapping: ["Produktion_Q1:Kosten_EUR", "Plant_Detroit:Cost_USD"],
            confidence: 0.91,
            anomaly: {
              type: "LOCALE_DECIMAL",
              description: "German comma decimal '12,50' detected in DE sheet",
              quickFixLabel: "Parse EU Decimal (',' → '.')",
              fixed: true
            },
            transform: { op: "PARSE_EU_DECIMAL" },
            samples: {
              rawUnfixed: "'12,50'",
              rawFixed: "12.50",
              transformed: "12.50"
            }
          },
          {
            name: "source_region",
            icon: "🌐",
            type: "String",
            isPk: false,
            sourceMapping: "EXTRACT_FROM_FILENAME",
            confidence: 0.98,
            transform: { op: "REGEX_EXTRACT", pattern: ".*_([A-Z]{2})_?.*\.xlsx", captureGroup: 1 },
            samples: { raw: "2023_Fertigung_DE.xlsx", transformed: "DE" }
          }
        ]
      },
      targetSink: {
        type: "duckdb",
        path: "./warehouse.duckdb",
        tableMode: "CREATE_IF_NOT_EXISTS",
        preflightStatus: "VERIFIED"
      },
      migration: {
        isRunning: false,
        isCancelled: false,
        totalRows: 81620,
        processedRows: 0,
        currentStage: "Ready",
        logs: []
      }
    };

    let state = JSON.parse(JSON.stringify(INITIAL_STATE));

    // --- Theme Management ---
    function toggleTheme() {
      const html = document.documentElement;
      if (html.classList.contains("dark")) {
        html.classList.remove("dark");
        localStorage.setItem("theme", "light");
      } else {
        html.classList.add("dark");
        localStorage.setItem("theme", "dark");
      }
    }

    // --- Variant Management ---
    const VARIANTS = [
      { key: "A", name: "A — Notion SaaS Pipeline (Recommended)" },
      { key: "B", name: "B — NocoDB Master-Detail Studio" },
      { key: "C", name: "C — Airtable Matrix Grid" }
    ];

    function initVariantFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const v = params.get("variant");
      if (v && ["A", "B", "C"].includes(v.toUpperCase())) {
        state.variant = v.toUpperCase();
      } else {
        state.variant = "A";
      }
      render();
    }

    function setVariant(newKey) {
      state.variant = newKey;
      const url = new URL(window.location.href);
      url.searchParams.set("variant", newKey);
      window.history.replaceState({}, "", url);
      render();
    }

    function nextVariant() {
      const idx = VARIANTS.findIndex(v => v.key === state.variant);
      const nextIdx = (idx + 1) % VARIANTS.length;
      setVariant(VARIANTS[nextIdx].key);
    }

    function prevVariant() {
      const idx = VARIANTS.findIndex(v => v.key === state.variant);
      const prevIdx = (idx - 1 + VARIANTS.length) % VARIANTS.length;
      setVariant(VARIANTS[prevIdx].key);
    }

    window.addEventListener("keydown", (e) => {
      if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
      if (e.key === "ArrowRight") nextVariant();
      if (e.key === "ArrowLeft") prevVariant();
    });

    function resetPrototypeState() {
      state = JSON.parse(JSON.stringify(INITIAL_STATE));
      render();
    }

    // --- State Actions ---
    function setStage(newStage) {
      state.stage = newStage;
      render();
    }

    function toggleQuickFix(colIndex) {
      const col = state.targetSchema.columns[colIndex];
      if (col && col.anomaly) {
        col.anomaly.fixed = !col.anomaly.fixed;
        render();
      }
    }

    function simulatePreflight() {
      state.targetSink.preflightStatus = "RUNNING";
      render();
      setTimeout(() => {
        state.targetSink.preflightStatus = "VERIFIED";
        render();
      }, 600);
    }

    let migrationInterval = null;
    function startMigration() {
      state.migration.isRunning = true;
      state.migration.isCancelled = false;
      state.migration.processedRows = 0;
      state.migration.logs = [
        "[SSE: 1] Initializing Polars LazyFrame execution engine...",
        "[SSE: 2] Verified Target Sink permissions on ./warehouse.duckdb",
        "[SSE: 3] Rust Calamine pre-extraction: processing 2023_Fertigung_DE.xlsx [Header offset row 5]..."
      ];
      render();

      if (migrationInterval) clearInterval(migrationInterval);
      migrationInterval = setInterval(() => {
        if (state.migration.processedRows < state.migration.totalRows) {
          state.migration.processedRows += Math.floor(Math.random() * 9500) + 4000;
          if (state.migration.processedRows > state.migration.totalRows) {
            state.migration.processedRows = state.migration.totalRows;
          }
          const pct = Math.round((state.migration.processedRows / state.migration.totalRows) * 100);
          state.migration.logs.push(`[SSE] Ingested ${state.migration.processedRows.toLocaleString()} / ${state.migration.totalRows.toLocaleString()} rows (${pct}%)`);
          render();
        } else {
          clearInterval(migrationInterval);
          state.migration.isRunning = false;
          state.migration.logs.push("[SSE: DONE] Migration completed in 1.42s. 81,620 rows committed into DuckDB table `production_events`.");
          render();
        }
      }, 350);
    }

    function cancelMigration() {
      if (migrationInterval) clearInterval(migrationInterval);
      state.migration.isRunning = false;
      state.migration.isCancelled = true;
      state.migration.logs.push("[SSE: CANCELLED] Received user cancellation token (asyncio.Event). Cooperative worker terminated cleanly without lock corruption.");
      render();
    }

    let isDrawerOpen = false;
    function toggleSampleDrawer() {
      isDrawerOpen = !isDrawerOpen;
      const drawer = document.getElementById("sample-drawer-content");
      const arrow = document.getElementById("sample-drawer-arrow");
      const btnText = document.querySelector("#sample-drawer-toggle-btn span");
      if (isDrawerOpen) {
        drawer.style.maxHeight = "480px";
        arrow.style.transform = "rotate(180deg)";
        btnText.textContent = "Collapse Table";
      } else {
        drawer.style.maxHeight = "44px";
        arrow.style.transform = "rotate(0deg)";
        btnText.textContent = "Expand Table";
      }
    }

    // --- Render Pipeline ---
    function render() {
      const currentVariant = VARIANTS.find(v => v.key === state.variant);
      document.getElementById("variant-label").textContent = currentVariant ? currentVariant.name : state.variant;

      renderSampleTable();

      const root = document.getElementById("app-root");
      if (state.variant === "A") {
        root.innerHTML = renderVariantA();
      } else if (state.variant === "B") {
        root.innerHTML = renderVariantB();
      } else {
        root.innerHTML = renderVariantC();
      }
    }

    function renderSampleTable() {
      const table = document.getElementById("dry-run-sample-table");
      if (!table) return;

      const cols = state.targetSchema.columns;
      let html = `<thead><tr class="border-b border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-900/50">`;
      cols.forEach(c => {
        html += `<th class="py-2 px-3 font-normal">${c.icon} ${c.name} <span class="text-[10px] text-slate-400">(${c.type})</span></th>`;
      });
      html += `</tr></thead><tbody class="divide-y divide-slate-100 dark:divide-slate-800 text-slate-600 dark:text-slate-300">`;

      const sampleRows = [

            <button onclick="startMigration()" class="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-md text-xs font-medium transition shadow-sm">Execute Stream</button>
          </div>

          <div class="grid grid-cols-12 gap-4">
            <!-- Left Hierarchy Explorer -->
            <div class="col-span-12 md:col-span-3 bg-white dark:bg-notion-cardDark border border-slate-200 dark:border-notion-borderDark rounded-xl p-4 space-y-3 shadow-sm">
              <h4 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Source Tree</h4>
              <div class="space-y-2 text-xs font-mono">
                <div class="p-2 bg-slate-50 dark:bg-slate-900/60 rounded border border-slate-200 dark:border-slate-800 space-y-1">
                  <div class="font-semibold text-slate-800 dark:text-slate-200 truncate">📁 2023_Fertigung_DE.xlsx</div>
                  <div class="pl-4 text-emerald-600 dark:text-emerald-400">└ 📊 Produktion_Q1</div>
                  <div class="pl-4 text-slate-400">└ 📊 Qualitaet_Log</div>
                </div>
                <div class="p-2 bg-slate-50 dark:bg-slate-900/60 rounded border border-slate-200 dark:border-slate-800 space-y-1">

                  <div class="pl-4 text-emerald-600 dark:text-emerald-400">└ 📊 Plant_Detroit</div>
                </div>
              </div>
            </div>

            <!-- Center Mapping Cards -->
            <div class="col-span-12 md:col-span-9 bg-white dark:bg-notion-cardDark border border-slate-200 dark:border-notion-borderDark rounded-xl p-4 space-y-3 shadow-sm">
              <div class="flex items-center justify-between">
                <h4 class="text-xs font-bold text-slate-900 dark:text-slate-100 font-mono">production_events</h4>
                <span class="text-[11px] text-slate-400 font-mono">${cols.length} properties</span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[500px] overflow-y-auto custom-scrollbar pr-1">
                ${cols.map((col, idx) => `
                  <div class="p-3 bg-slate-50 dark:bg-slate-900/40 rounded-lg border ${col.anomaly && !col.anomaly.fixed ? 'border-amber-300 dark:border-amber-800/60' : 'border-slate-200 dark:border-slate-800'} space-y-2">
                    <div class="flex items-center justify-between text-xs">
                      <span class="font-mono font-bold text-slate-800 dark:text-slate-200">${col.icon} ${col.name}</span>
                      <span class="text-[10px] text-slate-400 font-mono">${col.type}</span>
                    </div>
                    ${col.anomaly ? `
                      <button onclick="toggleQuickFix(${idx})" class="w-full py-1 text-[10px] font-bold rounded ${col.anomaly.fixed ? 'bg-emerald-600 text-white' : 'bg-amber-500 text-slate-950'}">
                        ${col.anomaly.fixed ? '✓ Fixed' : '⚡ ' + col.anomaly.quickFixLabel}
                      </button>
                    ` : ''}
                    <div class="text-[11px] text-slate-500 font-mono flex items-center justify-between pt-1 border-t border-slate-200 dark:border-slate-800">
                      <span>op: ${col.transform.op}</span>
                      <span class="text-emerald-600 dark:text-emerald-400 font-semibold">${col.samples.transformed}</span>
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>
          </div>
        </div>
      `;
    }
